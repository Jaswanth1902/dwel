[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dwel"
version = "0.1.0"
description = "Deterministic runtime cycle detection and execution loop prevention for autonomous AI agents."
readme = "README.md"
authors = [{ name = "Jaswanth Reddy", email = "jaswanth1902@users.noreply.github.com" }]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
]
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["dwel*"]
exclude = ["tests*"]

[project.urls]
Homepage = "https://github.com/Jaswanth1902/dwel"
Repository = "https://github.com/Jaswanth1902/dwel.git"
Issues = "https://github.com/Jaswanth1902/dwel/issues"
