[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dwel"
version = "0.1.0"
description = "Non-progressing cycle detection & token optimization engine for autonomous LLM agent trajectories"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jaswanth Reddy", email = "jaswanthreddy1537@gmail.com" }]
license = { text = "MIT" }
keywords = ["llm-agents", "agentic-ai", "optimization", "cycle-detection", "tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
